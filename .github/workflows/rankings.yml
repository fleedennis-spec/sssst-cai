name: Update AP rankings

on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * 1'   # Mondays, morning Central time

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch 2026 rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          mkdir -p data
          for type in regular postseason; do
            curl -sS --fail-with-body --get "https://api.collegefootballdata.com/rankings" \
              --data-urlencode "year=2026" \
              --data-urlencode "seasonType=$type" \
              -H "Authorization: Bearer $CFBD_API_KEY" -o "$type.json"
          done
          jq -s 'add' regular.json postseason.json > data/rankings-2026.json
          echo "Poll weeks saved: $(jq length data/rankings-2026.json)"
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings-2026.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update 2026 AP rankings"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
